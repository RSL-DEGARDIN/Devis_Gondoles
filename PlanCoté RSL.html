<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Mise en page : barre d'outils | feuille de dessin (papier blanc, identique dans les deux thèmes) | panneau propriétés ; barre d'état en bas */
:root{
  --bg:#e8ecf1; --panel:#f7f9fb; --raise:#ffffff; --line:#cdd5df; --fg:#17202b; --muted:#566273;
  --accent:#1d4fb5; --accent-fg:#ffffff; --accent-soft:#dde7fa; --danger:#b42318; --ok:#1d7a3a;
  --paper:#ffffff; --sheet-edge:#c3cbd6;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-head:"Barlow Semi Condensed","Barlow",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10141a;--panel:#161b23;--raise:#1d242e;--line:#2b3441;--fg:#e3e8ef;--muted:#93a0b2;--accent:#6e98ff;--accent-fg:#0b1222;--accent-soft:#1c2944;--danger:#ff8a7a;--ok:#5cc983;--sheet-edge:#2b3441;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10141a;--panel:#161b23;--raise:#1d242e;--line:#2b3441;--fg:#e3e8ef;--muted:#93a0b2;--accent:#6e98ff;--accent-fg:#0b1222;--accent-soft:#1c2944;--danger:#ff8a7a;--ok:#5cc983;--sheet-edge:#2b3441;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-ui);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-block:10px}

/* barre du haut */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:6px;font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--accent)}
.brand small{font:500 11px/1 var(--f-num);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 4px;letter-spacing:.04em}
#planName{flex:1 1 220px;min-width:0;max-width:380px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:600}
#saveState{font-size:13px;color:var(--muted);white-space:nowrap}
#saveState.dirty{color:var(--danger)}
.grow{flex:1 1 0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.icon{padding:6px 8px}
.btn.danger{color:var(--danger)}
.btn svg{width:17px;height:17px}

/* zone principale */
.main{display:grid;grid-template-columns:54px minmax(0,1fr) 300px;gap:10px;min-height:0}
.tools{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;overflow:auto}
.tools button{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--fg)}
.tools button:hover{background:var(--accent-soft)}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tools button svg{width:22px;height:22px}
.tools kbd{position:absolute;right:3px;bottom:2px;font:500 9px/1 var(--f-num);opacity:.6}
.tools .sep{flex:none;height:1px;width:100%;background:var(--line);margin:3px 0}
.sheet{position:relative;background:var(--paper);border:1px solid var(--sheet-edge);border-radius:8px;overflow:hidden;min-height:0;min-width:0}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:14px 14px 18px;min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:700 17px/1.2 var(--f-head);letter-spacing:.01em;text-wrap:balance}
.panel h3{margin:4px 0 0;font:600 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:14px}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fld>span:first-child{font-weight:500}
.fld input[type=text],.fld select,.num{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:14px}
.fld input[type=text],.fld select{padding:6px 8px}
.num{display:flex;align-items:center}
.num input{flex:1;min-width:0;border:0;background:transparent;padding:6px 8px;font:500 14px var(--f-num);font-variant-numeric:tabular-nums}
.num i{font:normal 12px var(--f-num);color:var(--muted);padding-right:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2>*{min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.swb{width:24px;height:24px;border-radius:4px;border:1px solid var(--line);background:var(--c);cursor:pointer;padding:0}
.swb.none{background:linear-gradient(135deg,transparent 45%,#d7262e 45%,#d7262e 55%,transparent 55%),var(--raise)}
.swb.on{outline:2px solid var(--accent);outline-offset:1px}
.sw input[type=color]{width:30px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:4px;background:var(--raise);cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .btn{padding:5px 9px;font-size:14px}
.readout{font:500 13px/1.5 var(--f-num);color:var(--fg);font-variant-numeric:tabular-nums;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.keys{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:13px;color:var(--muted)}
.keys kbd{font:500 11px var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--fg);background:var(--raise)}

/* barre d'état */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.status .grp{display:flex;align-items:center;gap:6px}
.status select{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:13px}
.tg{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:13px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--fg)}
#stTyped{color:var(--accent);font-weight:500}

/* fenêtres */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg h2{margin:0;font:700 20px/1.2 var(--f-head)}
.dlg p{margin:0}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plist .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);background:var(--raise)}
.plist .it:first-child{border-top:0}
.plist .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.plist .it .dt{font:12px var(--f-num);color:var(--muted);white-space:nowrap}
.plist .empty{padding:18px;color:var(--muted);text-align:center;background:var(--raise)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;background:var(--raise);font-weight:500}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{accent-color:var(--accent)}
.info{font-size:14px;border-radius:6px;padding:8px 10px;background:var(--accent-soft)}
.info.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:820px){
  body{font-size:14px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,34%)}
  .tools{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .tools .sep{width:1px;height:auto;margin:0 3px}
  #planName{max-width:none}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.tools button{transition:background-color .12s,border-color .12s}}
</style>

<script>
'use strict';
/* ================= utilitaires ================= */
const $=s=>document.querySelector(s);
const cv=$('#cv'), gGrid=$('#gGrid'), gC=$('#gContent'), gO=$('#gOver'), sheet=$('#sheet'), panel=$('#panel');
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], len=a=>Math.hypot(a[0],a[1]), perp=a=>[-a[1],a[0]];
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r=v=>Math.round(v*100)/100;
const P=p=>r(p[0])+' '+r(p[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=v=>{const n=Math.round(v);return (n<0?'-':'')+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const fmtArea=a=>(Math.abs(a)/1e6).toFixed(1).replace('.',',')+' m²';
const UIF='Barlow, Helvetica, Arial, sans-serif';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function distSeg(p,a,b){const ab=sub(b,a),L2=dot(ab,ab);const t=L2?clamp(dot(sub(p,a),ab)/L2,0,1):0;return len(sub(p,add(a,mul(ab,t))))}
function polyArea(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2}
function centroid(pts){const A=polyArea(pts);if(Math.abs(A)<1e-6){const s=pts.reduce((m,p)=>add(m,p),[0,0]);return mul(s,1/pts.length)}
  let cx=0,cy=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],c=a[0]*b[1]-b[0]*a[1];cx+=(a[0]+b[0])*c;cy+=(a[1]+b[1])*c}return [cx/(6*A),cy/(6*A)]}
function inRings(p,rings){let c=false;for(const R of rings)for(let i=0,j=R.length-1;i<R.length;j=i++){const a=R[i],b=R[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function nearPoly(p,pts,closed,tol){for(let i=0;i<pts.length-(closed?0:1);i++)if(distSeg(p,pts[i],pts[(i+1)%pts.length])<=tol)return true;return false}
/* Décale une polyligne de d (côté perp), angles en onglet. */
function offsetPolyline(pts,d,closed){const n=pts.length,out=[];
  for(let i=0;i<n;i++){const p=pts[i],prev=i>0?pts[i-1]:(closed?pts[n-1]:null),next=i<n-1?pts[i+1]:(closed?pts[0]:null);
    if(!prev||!next){const dir=norm(prev?sub(p,prev):sub(next,p));out.push(add(p,mul(perp(dir),d)));continue}
    const d1=norm(sub(p,prev)),d2=norm(sub(next,p)),n1=perp(d1),n2=perp(d2);
    if(Math.abs(d1[0]*d2[1]-d1[1]*d2[0])<1e-6){out.push(add(p,mul(n1,d)));continue}
    out.push(add(p,mul(add(n1,n2),d/(1+dot(n1,n2)))))}
  return out}
const ring=pts=>'M'+pts.map(P).join('L')+'Z';
const polyD=(pts,closed)=>'M'+pts.map(P).join('L')+(closed?'Z':'');

/* ================= constantes ================= */
const COLORS=['#2b313a','#5b636e','#9aa3ae','#d7262e','#e07b00','#e0b500','#1f8a3b','#1597a5','#1f4fd1','#7a3fc4','#c0369e'];
const FILLS=['none','#ffffff','#eceef1','#fdf3d4','#fde3e1','#e2f3e6','#dcf1f4','#e1e9fb','#eee5fb'];
const KINDS=[['simple','Porte 1 battant'],['double','Porte 2 battants'],['coulissante','Porte coulissante'],['sectionnelle','Porte sectionnelle'],['ouverture','Ouverture (sans porte)'],['fenetre','Fenêtre']];
const JUST=[['center','Centré sur le trait'],['neg','À gauche du trait (sens du tracé)'],['pos','À droite du trait (sens du tracé)']];
const WIDTHS=[[0.5,'Très fin'],[1,'Fin'],[1.5,'Moyen'],[2,'Épais'],[3,'Très épais']];
const DASH=[['solid','Continu'],['dash','Tirets'],['dot','Pointillés'],['axis','Mixte (axe)']];
const TOOLS=[['select','Sélection','V'],['pan','Déplacer la vue','H'],null,['wall','Mur','M'],['door','Porte','P'],['gap','Ouverture','O'],['window','Fenêtre','F'],null,['line','Ligne / zone','L'],['rect','Rectangle','R'],['post','Poteau','K'],['dim','Cote','D'],['text','Texte','T']];
const ICONS={
  select:'<path d="M6 3l13 9-6 1.4L10.4 20z" fill="currentColor"/>',
  pan:'<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  wall:'<path d="M3 4h18v5H8v11H3z" fill="currentColor"/>',
  door:'<path d="M3 20h4M17 20h4M7 20V7M7 7a13 13 0 0 1 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  gap:'<path d="M2 9h6v6H2zM16 9h6v6h-6z" fill="currentColor"/><path d="M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/>',
  window:'<path d="M2 9h4v6H2zM18 9h4v6h-4z" fill="currentColor"/><path d="M6 9h12v6H6zM6 12h12" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  line:'<path d="M4 19l6-11 5 6 5-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>',
  rect:'<rect x="4" y="6" width="16" height="12" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  post:'<rect x="6" y="6" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.4"/>',
  dim:'<path d="M3 13h18M3 9v8M21 9v8M4.5 15l3-4M16.5 15l3-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  text:'<path d="M5 6h14M12 6v13M9 19h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
const HINTS={
  select:'Cliquez un élément pour le modifier, glissez pour le déplacer. Glissez dans le vide pour sélectionner une zone.',
  pan:'Glissez pour déplacer la vue. La molette zoome.',
  wall:'Cliquez pour poser chaque angle. Tapez une longueur puis Entrée pour un mur exact. Double-clic ou Entrée pour terminer, C pour fermer. Pour saisir des cotes intérieures (mur à mur) : tracez dans le sens des aiguilles d\'une montre avec le mur « à gauche du trait ».',
  door:'Survolez un mur et cliquez. La porte s\'ouvre du côté où se trouve la souris.',
  gap:'Survolez un mur et cliquez pour créer l\'ouverture.',
  window:'Survolez un mur et cliquez pour placer la fenêtre.',
  line:'Cliquez pour poser les points, tapez une longueur puis Entrée. C ferme la forme : elle devient une zone avec sa surface.',
  rect:'Cliquez deux coins opposés, ou un coin puis tapez 6035x2500 et Entrée.',
  post:'Cliquez pour poser un poteau (croix). Le centre s\'accroche à la grille.',
  dim:'Cliquez le 1er point, le 2e, puis placez la ligne de cote. Les points s\'accrochent aux angles des murs et aux bords des portes.',
  text:'Cliquez pour poser un texte, puis tapez-le dans le panneau.'
};
const DEF={
  wall:{thick:200,just:'center',color:'#5b636e',height:3000},
  door:{kind:'simple',width:900,color:'#2b313a'},

/* ================= accrochage ================= */
/* Segments visibles d'un élément, pour l'accroche aux croisements. */

/* ================= dessin SVG ================= */
function txt(p,s,size,col,font,o={}){

  const halo=o.halo?` stroke="#ffffff" stroke-width="${r(o.halo)}" stroke-linejoin="round" paint-order="stroke"`:'';
  return `<text x="${r(p[0])}" y="${r(p[1]+size*.35)}" font-size="${r(size)}" font-family="${font}" fill="${col}" text-anchor="${o.anchor||'middle'}"${o.bold?' font-weight="bold"':''}${halo}${tr}>${esc(s)}</text>`;
}

      if(it.cross)s+=`<path d="M${r(it.x)} ${r(it.y)}l${r(it.w)} ${r(it.h)}M${r(it.x+it.w)} ${r(it.y)}l${r(-it.w)} ${r(it.h)}" stroke="${it.color}" stroke-width="${r(it.width*U*.8)}"/>`;

    case 'double':{d+=`M${-hw} ${r(y0)}V${r(y0+s*hw)}A${hw} ${hw} 0 0 ${s>0?0:1} 0 ${r(y0)}M${hw} ${r(y0)}V${r(y0+s*hw)}A${hw} ${hw} 0 0 ${s>0?1:0} 0 ${r(y0)}`;break}
    case 'coulissante':{const yy=r(y0+s*Math.max(th*.3,4*U));extra=`<path d="M${-hw} ${yy}H${r(hw*1.15)}" stroke="${col}" stroke-width="${r(2.5*U)}"/>`;break}

/* Les ouvertures sont dessinées après le reste pour couper les murs. */

/* ================= vue ================= */
function setView(){cv.setAttribute('viewBox',`${view.x} ${view.y} ${W/view.z} ${H/view.z}`);renderAll()}

  const bw=Math.max(b.x1-b.x0,1000),bh=Math.max(b.y1-b.y0,1000);view.z=Math.min(W/(bw*1.12),H/(bh*1.12));

function renderGrid(){

/* ================= surcouche (aperçus, sélection) ================= */
const ACC='#1d4fb5', SEL='#ff7a00';
function label(p,s,U){return txt(add(p,[14*U,-14*U]),s,12.5*U,ACC,'IBM Plex Mono, monospace',{anchor:'start',halo:3.5*U,bold:true})}
function outline(it,U,col,dash){
  const st=`fill="none" stroke="${col}" stroke-width="${r(1.6*U)}"${dash?` stroke-dasharray="${r(5*U)} ${r(3*U)}"`:''}`;
  switch(it.type){
    case 'wall':return `<path d="${wallRings(it).map(ring).join('')}" ${st}/>`;
    case 'line':return `<path d="${polyD(it.pts,it.closed)}" ${st}/>`;
    case 'rect':return `<path d="${ring(rectCorners(it))}" ${st}/>`;
    case 'opening':{const g=openingGeom(it);if(!g)return '';const hw=it.width/2,th=g.thick/2+2*U;return `<path d="${ring([[-hw,-th],[hw,-th],[hw,th],[-hw,th]].map(q=>add(g.c,add(mul(g.dir,q[0]),mul(g.nn,q[1])))))}" ${st}/>`}
    case 'dim':{const [a2,b2]=dimLine(it);return `<path d="M${P(a2)}L${P(b2)}" ${st}/>`}
    case 'text':{const b=bbox(it);return `<rect x="${b.x0}" y="${b.y0}" width="${b.x1-b.x0}" height="${b.y1-b.y0}" ${st}/>`}
  }
  return '';
}
function handles(it){
  switch(it.type){
    case 'wall':case 'line':return it.pts.map((p,i)=>({p,kind:'v',i}));
    case 'rect':return rectCorners(it).map((p,i)=>({p,kind:'c',i}));
    case 'dim':{const [a2,b2]=dimLine(it);return [{p:it.a,kind:'a'},{p:it.b,kind:'b'},{p:mul(add(a2,b2),.5),kind:'o'}]}
  }

}
function openingDims(o,U){const D=openingDist(o);if(!D)return '';const {g}=D,hw=Math.min(o.width,g.L)/2;
  const e1=add(add(g.p0,mul(g.dir,g.t-hw)),mul(g.nn,D.faceOff)),e2=add(add(g.p0,mul(g.dir,g.t+hw)),mul(g.nn,D.faceOff)),off=(o.side||1)*30*U;
  return (D.a>0.5?dimSVG(D.fs,e1,off,ACC,12*U,U,UIF,fmt(D.a)):'')+(D.b>0.5?dimSVG(e2,D.fe,off,ACC,12*U,U,UIF,fmt(D.b)):'')}
function renderOverlay(){
  const U=u();let s='';

  if(si.length===1){if(si[0].type==='opening')s+=openingDims(si[0],U);
    for(const h of handles(si[0]))s+=`<rect x="${r(h.p[0]-4*U)}" y="${r(h.p[1]-4*U)}" width="${r(8*U)}" height="${r(8*U)}" fill="#ffffff" stroke="${SEL}" stroke-width="${r(1.5*U)}"/>`}
  if(drag&&drag.mode==='band'){const a=drag.a,b=drag.b;s+=`<rect x="${Math.min(a[0],b[0])}" y="${Math.min(a[1],b[1])}" width="${Math.abs(b[0]-a[0])}" height="${Math.abs(b[1]-a[1])}" fill="rgba(29,79,181,.07)" stroke="${ACC}" stroke-width="${U}" stroke-dasharray="${4*U} ${3*U}"/>`}
  if(cur.inside&&!drag)s+=toolPreview(U);
  if(drag&&drag.mode==='move'&&drag.moved){const d=sub(cur.p,drag.grab);s+=label(cur.p,`Δ ${fmt(d[0])} ; ${fmt(d[1])}`,U)}
  const sp=cur.snap;
  if(cur.inside&&sp&&sp.kind==='int')s+=`<path d="M${r(sp.p[0]-6*U)} ${r(sp.p[1]-6*U)}l${r(12*U)} ${r(12*U)}m0 ${r(-12*U)}l${r(-12*U)} ${r(12*U)}" stroke="#e5007e" stroke-width="${r(2*U)}"/>`;
  if(cur.inside&&sp&&(sp.kind==='obj'||sp.kind==='align')){const q=sp.kind==='align'?sp.ref:sp.p;
    s+=`<rect x="${r(q[0]-5*U)}" y="${r(q[1]-5*U)}" width="${r(10*U)}" height="${r(10*U)}" fill="none" stroke="#e5007e" stroke-width="${r(1.5*U)}"/>`;
    if(sp.kind==='align')s+=`<path d="M${P(sp.ref)}L${P(sp.p)}" stroke="#e5007e" stroke-width="${r(U)}" stroke-dasharray="${r(3*U)} ${r(3*U)}"/>`}
  if(typed&&cur.inside)s+=label(add(cur.p,[0,22*U]),'⌨ '+typed,U);

}
/* Angle du segment a→p : 0° = horizontale vers la droite, positif vers le haut (sens trigonométrique). */
const angleOf=(a,p)=>{const d=sub(p,a);return -Math.atan2(d[1],d[0])*180/Math.PI};
const angTxt=g=>(Math.round(g*10)/10).toFixed(1).replace('.',',').replace(/,0$/,'')+'°';
const orthoOn=()=>settings.ortho!==keys.shift;   // en ortho, l'angle (0/90/180°) n'apporte rien : on ne l'affiche pas
const lenAng=(a,p)=>fmt(len(sub(p,a)))+' mm'+(orthoOn()?'':' · '+angTxt(angleOf(a,p)));
function angleArc(a,p,U){
  const L=len(sub(p,a)),g=angleOf(a,p);if(orthoOn()||L<1e-6||Math.abs(g)<0.05)return '';
  const R=Math.min(45*U,L*0.6),t=g*Math.PI/180,e=[a[0]+R*Math.cos(t),a[1]-R*Math.sin(t)];
  return `<path d="M${P(a)}h${r(R*1.35)}" stroke="${ACC}" stroke-width="${r(U)}" stroke-dasharray="${r(3*U)} ${r(3*U)}" opacity=".7"/>`+
    `<path d="M${r(a[0]+R)} ${r(a[1])}A${r(R)} ${r(R)} 0 0 ${g>0?0:1} ${P(e)}" fill="none" stroke="${ACC}" stroke-width="${r(1.2*U)}"/>`;
}
function toolPreview(U){
  const p=cur.p;let s='';
  if(draft&&(draft.type==='wall'||draft.type==='line')){const pts=draft.pts.concat([p]);
    if(draft.type==='wall')s+=`<g opacity=".55">${drawItem({type:'wall',pts,closed:false,...defaults.wall},{u:U,font:UIF})}</g>`;
    else s+=`<path d="${polyD(pts,false)}" fill="none" stroke="${defaults.line.color}" stroke-width="${r(defaults.line.width*U)}" opacity=".7"/>`;
    const a=pts[pts.length-2];s+=`<path d="M${P(a)}L${P(p)}" stroke="${ACC}" stroke-width="${r(U)}" stroke-dasharray="${r(4*U)} ${r(3*U)}"/>`;
    s+=angleArc(a,p,U)+label(p,lenAng(a,p),U)}
  else if(draft&&draft.type==='rect'){const a=draft.a,x=Math.min(a[0],p[0]),y=Math.min(a[1],p[1]),w=Math.abs(p[0]-a[0]),h=Math.abs(p[1]-a[1]);
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${defaults.rect.fill==='none'?'none':defaults.rect.fill}" fill-opacity=".6" stroke="${defaults.rect.color}" stroke-width="${r(defaults.rect.width*U)}"/>`;
    s+=label(p,`${fmt(w)} × ${fmt(h)}`,U)}
  else if(draft&&draft.type==='dim'){
    if(!draft.b){s+=`<path d="M${P(draft.a)}L${P(p)}" stroke="${defaults.dim.color}" stroke-width="${r(U)}"/>`+angleArc(draft.a,p,U)+label(p,lenAng(draft.a,p),U)}
    else s+=dimSVG(draft.a,draft.b,dimOff(draft.a,draft.b,cur.raw),defaults.dim.color,+defaults.dim.size||state.textSize,U,UIF)}
  else if(['door','gap','window'].includes(tool)){const d=defaults[tool],h=hostAt(cur.raw,d.width);
    if(h){const tmp={id:'_tmp',type:'opening',kind:kindFor(tool),...h,width:d.width,hinge:1,color:ACC};s+=drawOpening(tmp,U)+openingDims(tmp,U)}}
  else if(tool==='post'){const z=defaults.post.size;s+=`<rect x="${r(p[0]-z/2)}" y="${r(p[1]-z/2)}" width="${z}" height="${z}" fill="none" stroke="${defaults.post.color}" stroke-width="${r(1.5*U)}" opacity=".7"/>`}
  if(tool!=='select'&&tool!=='pan')s+=`<path d="M${r(p[0]-7*U)} ${r(p[1])}h${r(14*U)}M${r(p[0])} ${r(p[1]-7*U)}v${r(14*U)}" stroke="${ACC}" stroke-width="${r(U)}"/>`;
  return s;
}
function renderStatus(){
  const p=cur.p;$('#stXY').textContent=`X ${fmt(p[0])} · Y ${fmt(p[1])}`;
  let L='';const from=draftFrom();
  if(from)L='L '+lenAng(from,p);
  $('#stLen').textContent=L;
  $('#stTyped').textContent=typed?`Saisie : ${typed} ↵`:'';
  $('#stZoom').textContent=`Écran ≈ 1:${fmt(1/(view.z*.2646))}`;
}
const kindFor=t=>t==='gap'?'ouverture':t==='window'?'fenetre':defaults.door.kind;
const dimOff=(a,b,raw)=>Math.round(dot(sub(raw,a),perp(norm(sub(b,a))))/10)*10;
function draftFrom(){if(!draft)return null;if(draft.pts)return draft.pts[draft.pts.length-1];if(draft.type==='dim'&&!draft.b)return draft.a;if(draft.type==='rect')return null;return null}

/* ================= historique & brouillon ================= */
const snapshot=()=>JSON.stringify({name:state.name,textSize:state.textSize,items:state.items});
function commit(){const s=snapshot();if(s===lastSnap)return;hist.push(lastSnap);if(hist.length>200)hist.shift();lastSnap=s;fut=[];unsaved=true;saveDraft();renderSaveState()}
function restore(s){const d=JSON.parse(s);state.name=d.name;state.textSize=d.textSize;state.items=d.items;for(const id of [...sel])if(!byId(id))sel.delete(id);$('#planName').value=state.name;unsaved=true;saveDraft();refreshPanel();renderAll();renderSaveState()}
function undo(){if(!hist.length)return;fut.push(lastSnap);lastSnap=hist.pop();restore(lastSnap)}
function redo(){if(!fut.length)return;hist.push(lastSnap);lastSnap=fut.pop();restore(lastSnap)}
let draftTimer=0;
function saveDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>store.set('plancote.draft',{state,unsaved}),400)}
function renderSaveState(){const el=$('#saveState');el.className=unsaved?'dirty':'';el.textContent=unsaved?'● Non enregistré':(state.cloudId?'Enregistré':'')}

/* ================= création d'éléments ================= */
function addItem(it){it.id=it.id||uid();state.items.push(it);commit();return it}
function finishDraft(){
  if(!draft)return;
  if((draft.type==='wall'||draft.type==='line')&&draft.pts.length>=2){
    const d=defaults[draft.type],closed=!!draft.closed&&draft.pts.length>=3;
    if(draft.type==='wall')addItem({type:'wall',pts:draft.pts,closed,thick:d.thick,just:d.just,color:d.color});
    else addItem({type:'line',pts:draft.pts,closed,color:d.color,width:d.width,dash:d.dash,fill:closed?d.fill:'none',label:'',showArea:closed});
  }
  draft=null;typed='';renderAll();
}
function setRect(it,a,b){it.x=Math.min(a[0],b[0]);it.y=Math.min(a[1],b[1]);it.w=Math.max(1,Math.abs(b[0]-a[0]));it.h=Math.max(1,Math.abs(b[1]-a[1]))}
function addRect(a,b){const d=defaults.rect,it={type:'rect',color:d.color,fill:d.fill,width:d.width,dash:d.dash,cross:false,label:'',showArea:false};setRect(it,a,b);if(it.w>1&&it.h>1)addItem(it)}
function addPost(c){const d=defaults.post,z=+d.size||100;addItem({type:'rect',x:c[0]-z/2,y:c[1]-z/2,w:z,h:z,color:d.color,fill:'none',width:1.5,dash:'solid',cross:true,label:'',showArea:false})}
function applyTyped(){
  const nums=typed.replace(/,/g,'.').split(/[x*]/i).map(parseFloat).filter(v=>!isNaN(v));typed='';
  if(!nums.length||!draft){renderAll();return}
  const L=nums[0],dirTo=from=>{const d=sub(cur.p,from);return len(d)>1e-6?norm(d):[1,0]};
  if(draft.pts){const a=draft.pts[draft.pts.length-1];draft.pts.push(add(a,mul(dirTo(a),L)))}
  else if(draft.type==='rect'){const a=draft.a,h=nums[1]??L,sx=cur.p[0]<a[0]?-1:1,sy=cur.p[1]<a[1]?-1:1;addRect(a,[a[0]+sx*L,a[1]+sy*h]);draft=null}
  else if(draft.type==='dim'){if(!draft.b)draft.b=add(draft.a,mul(dirTo(draft.a),L));
    else{const o=dimOff(draft.a,draft.b,cur.raw);addItem({type:'dim',a:draft.a,b:draft.b,off:(o<0?-1:1)*L,color:defaults.dim.color,size:defaults.dim.size,text:''});draft=null}}
  renderAll();
}

/* ================= outils ================= */
function buildTools(){$('#tools').innerHTML=TOOLS.map(t=>t?`<button data-tool="${t[0]}" title="${t[1]} (${t[2]})" aria-label="${t[1]}" aria-pressed="${t[0]===tool}"><svg viewBox="0 0 24 24">${ICONS[t[0]]}</svg><kbd>${t[2]}</kbd></button>`:'<span class="sep"></span>').join('')}
function setTool(t){
  if(draft)finishDraft();
  tool=t;typed='';
  document.querySelectorAll('#tools button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t));
  cv.style.cursor=t==='pan'?'grab':t==='select'?'default':'crosshair';
  if(t!=='select'){sel.clear()}
  refreshPanel();renderAll();
}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('button[data-tool]');if(b)setTool(b.dataset.tool)});

/* ================= souris / tactile ================= */
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  tolK=e.pointerType==='touch'?2:1;cv.setPointerCapture(e.pointerId);
  const raw=toW(e);cur.raw=raw;cur.inside=true;
  if(e.button===1||keys.space||tool==='pan'){drag={mode:'pan',cx:e.clientX,cy:e.clientY,vx:view.x,vy:view.y};cv.style.cursor='grabbing';return}
  if(e.button===2){if(draft)finishDraft();else setTool('select');return}
  const now=Date.now(),dbl=now-lastDown.t<350&&Math.hypot(e.clientX-lastDown.x,e.clientY-lastDown.y)<8;lastDown={t:now,x:e.clientX,y:e.clientY};
  if(tool==='select')selectDown(raw,e);else drawDown(raw,dbl);
});
cv.addEventListener('pointermove',e=>{
  const raw=toW(e);cur.raw=raw;cur.inside=true;
  if(drag){
    if(drag.mode==='pan'){view.x=drag.vx-(e.clientX-drag.cx)/view.z;view.y=drag.vy-(e.clientY-drag.cy)/view.z;setView();return}
    if(drag.mode==='band'){drag.b=raw;cur.p=raw;renderOverlay();return}
    if(drag.mode==='move'){if(!drag.moved&&Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)<4)return;moveDrag(raw)}
    if(drag.mode==='handle')handleDrag(raw);
    renderContent();renderOverlay();renderStatus();return;
  }
  if(tool==='select'){cur.p=raw;cur.snap=null;const h=hitTest(raw);if(h!==hover){hover=h}cv.style.cursor=hover?'move':'default'}
  else{const sp=snapPoint(raw,draftFrom());cur.p=sp.p;cur.snap=sp}
  renderOverlay();renderStatus();
});
cv.addEventListener('pointerleave',()=>{if(!drag){cur.inside=false;hover=null;renderOverlay()}});
cv.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.mode==='pan'){cv.style.cursor=tool==='pan'?'grab':tool==='select'?'default':'crosshair';return}
  if(d.mode==='band'){const x0=Math.min(d.a[0],d.b[0]),x1=Math.max(d.a[0],d.b[0]),y0=Math.min(d.a[1],d.b[1]),y1=Math.max(d.a[1],d.b[1]);
    if((x1-x0)*view.z>4||(y1-y0)*view.z>4)for(const it of state.items){const b=bbox(it);if(b&&b.x0>=x0&&b.x1<=x1&&b.y0>=y0&&b.y1<=y1)sel.add(it.id)}}
  if((d.mode==='move'&&d.moved)||d.mode==='handle')commit();
  cur.snap=null;refreshPanel();renderAll();
});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=toW(e),k=Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),z=clamp(view.z*k,.002,40);
  view.x=p[0]-(p[0]-view.x)*view.z/z;view.y=p[1]-(p[1]-view.y)*view.z/z;view.z=z;setView()},{passive:false});

function selectDown(raw,e){
  const U=u()*tolK;
  if(sel.size===1){const it=selItems()[0];for(const h of handles(it))if(len(sub(h.p,raw))<=8*U){drag={mode:'handle',it,h,orig:clone(it)};return}}
  const hit=hitTest(raw);
  if(hit){
    if(e.shiftKey){sel.has(hit.id)?sel.delete(hit.id):sel.add(hit.id);refreshPanel();renderAll();return}
    if(!sel.has(hit.id)){sel=new Set([hit.id]);refreshPanel()}
    const moving=selItems();let grab=raw,bd=10*U;
    for(const it of moving)for(const q of snapPts(it)){const d=len(sub(q,raw));if(d<bd){bd=d;grab=q}}
    drag={mode:'move',grab,orig:moving.map(clone),ids:new Set(moving.map(i=>i.id)),moved:false,cx:e.clientX,cy:e.clientY};
  }else{if(!e.shiftKey&&sel.size){sel.clear();refreshPanel()}drag={mode:'band',a:raw,b:raw}}
  renderAll();
}
function translate(it,o,d){
  switch(it.type){
    case 'wall':case 'line':it.pts=o.pts.map(p=>add(p,d));break;
    case 'rect':case 'text':it.x=o.x+d[0];it.y=o.y+d[1];break;
    case 'dim':it.a=add(o.a,d);it.b=add(o.b,d);break;
  }
}
function moveDrag(raw){

  const sp=snapPoint(raw,d.grab,d.ids);cur.p=sp.p;cur.snap=sp;const delta=sub(sp.p,d.grab);

    case 'c':{const C=rectCorners(drag.orig);sp=snapPoint(raw,null,ex);setRect(it,C[(h.i+2)%4],sp.p);break}
    case 'a':case 'b':sp=snapPoint(raw,h.kind==='a'?it.b:it.a,ex);it[h.kind]=sp.p;break;
    case 'o':it.off=dimOff(it.a,it.b,raw);cur.p=raw;return;
  }

}
function drawDown(raw,dbl){

      else{addItem({type:'dim',a:draft.a,b:draft.b,off:dimOff(draft.a,draft.b,raw),color:defaults.dim.color,size:defaults.dim.size,text:''});draft=null}
      break}
    case 'post':addPost(snapPoint(raw,null).p);break;
    case 'door':case 'gap':case 'window':{const d=defaults[tool],h=hostAt(raw,d.width);
      if(!h){toast('Placez la souris sur un mur pour poser '+(tool==='window'?'la fenêtre.':tool==='door'?'la porte.':'l\'ouverture.'));return}
      addItem({type:'opening',kind:kindFor(tool),...h,width:d.width,hinge:1,color:d.color});break}
    case 'text':{const p=snapPoint(raw,null).p,d=defaults.text,it=addItem({type:'text',x:p[0],y:p[1],text:'Texte',size:d.size,color:d.color,bold:d.bold,rot:0});
      tool='select';buildTools();cv.style.cursor='default';sel=new Set([it.id]);refreshPanel();const f=document.getElementById('f-item-text');if(f){f.focus();f.select()}break}
  }
  renderAll();
}

/* ================= clavier ================= */
const SHORT={v:'select',h:'pan',m:'wall',p:'door',o:'gap',f:'window',l:'line',r:'rect',k:'post',d:'dim',t:'text'};
window.addEventListener('keydown',e=>{
  if(e.key==='Shift'){keys.shift=true;refreshPreview()}
  if(e.key==='Alt'){keys.alt=true;refreshPreview()}
  if(e.target.closest&&e.target.closest('input,select,textarea')){if(e.key==='Escape')e.target.blur();return}
  if(e.target.closest&&e.target.closest('button')&&(e.key==='Enter'||e.key===' '))return;
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}

  if(draft&&/^[0-9.,]$/.test(k)||(draft&&typed&&/^[x*]$/i.test(k))){typed+=k;renderOverlay();renderStatus();e.preventDefault();return}
  if(k==='Backspace'&&typed){typed=typed.slice(0,-1);renderOverlay();renderStatus();e.preventDefault();return}

  if(k==='Escape'){if(typed)typed='';else if(draft)finishDraft();else if(sel.size){sel.clear();refreshPanel()}else setTool('select');renderAll();return}

  if((k==='Delete'||k==='Backspace')&&sel.size){e.preventDefault();deleteSel();return}
  if(k.startsWith('Arrow')&&sel.size){e.preventDefault();const st=(+settings.snap||10)*(e.shiftKey?10:1),d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[k];
    for(const it of selItems())translate(it,clone(it),d);commit();refreshPanel();renderAll();return}
  if(!e.altKey&&SHORT[lk]&&!draft){setTool(SHORT[lk]);return}
});

function deleteSel(){const gone=new Set(sel);state.items=state.items.filter(it=>!gone.has(it.id)&&!(it.type==='opening'&&gone.has(it.host)));sel.clear();commit();refreshPanel();renderAll()}
function duplicate(){
  const its=selItems();if(!its.length)return;const map={},out=[];
  for(const it of its){if(it.type==='opening')continue;const c=clone(it);c.id=uid();map[it.id]=c.id;translate(c,it,[500,500]);out.push(c)}
  for(const o of state.items)if(o.type==='opening'&&map[o.host]){const c=clone(o);c.id=uid();c.host=map[o.host];out.push(c)}
  for(const it of its)if(it.type==='opening'&&!map[it.host]){const c=clone(it);c.id=uid();c.t=it.t+it.width+200;out.push(c)}

let specs={};
function fld(f,v,s){
  const id=`f-${s}-${f.k}`,a=`id="${id}" data-s="${s}" data-k="${f.k}"`;
  switch(f.t){
    case 'num':return `<label class="fld" for="${id}"><span>${f.l}</span><span class="num"><input ${a} type="number" step="any" inputmode="decimal" value="${v==null||(f.ph&&!v)?'':+(+v).toFixed(1)}" placeholder="${f.ph?f.ph+(f.k==='size'?' ('+fmt(state.textSize)+')':''):''}"><i>${f.unit}</i></span></label>`;
    case 'txt':return `<label class="fld" for="${id}"><span>${f.l}</span><input ${a} type="text" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}"></label>`;
    case 'sel':return `<label class="fld" for="${id}"><span>${f.l}</span><select ${a}>${f.o.map(([val,lab])=>`<option value="${val}"${String(val)===String(v)?' selected':''}>${lab}</option>`).join('')}</select></label>`;
    case 'chk':return `<label class="chk" for="${id}"><input ${a} type="checkbox"${v?' checked':''}><span>${f.l}</span></label>`;
    case 'col':case 'fill':{const list=f.t==='col'?COLORS:FILLS;
      return `<div class="fld"><span>${f.l}</span><div class="sw">${list.map(c=>`<button type="button" class="swb${c===v?' on':''}${c==='none'?' none':''}" style="--c:${c==='none'?'transparent':c}" data-s="${s}" data-k="${f.k}" data-v="${c}" title="${c==='none'?'Aucun':c}" aria-label="${c==='none'?'Aucun remplissage':'Couleur '+c}"></button>`).join('')}<input type="color" ${a} value="${v&&v!=='none'?v:'#ffffff'}" title="Autre couleur" aria-label="Autre couleur"></div></div>`}
  }

}
const btn=(act,lab,cls='')=>`<button type="button" class="btn ${cls}" data-act="${act}">${lab}</button>`;

  const its=selItems();let h='';specs={};

    h+=`<h2>${it.type==='opening'?KINDS.find(k=>k[0]===it.kind)[1]:it.type==='rect'&&it.cross?'Poteau':TYPE_NAME[it.type]}</h2>`;

    h+=`<p class="hint">Glissez pour déplacer l'ensemble, flèches pour décaler du pas (Maj ×10).</p><div class="acts">${btn('dup','Dupliquer')}${btn('front','Devant')}${btn('back','Derrière')}${btn('del','Supprimer','danger')}</div>`}

    if(DSPEC[tool]){specs.def=DSPEC[tool];h+=`<h3>Réglages de l'outil</h3>`+specs.def.map(f=>fld(f,defaults[tool][f.k],'def')).join('')}

function extraTop(it){
  if(it.type==='opening'){const D=openingDist(it);if(!D)return '<p class="hint">Mur introuvable.</p>';
    return `<div class="row2">${fld(num('da','Distance début'),D.a,'dist')}${fld(num('db','Distance fin'),D.b,'dist')}</div><p class="hint">Distances mesurées sur la face du mur, affichées en bleu sur le plan.</p><div class="acts">${btn('flipSide','Inverser le côté')}${it.kind==='simple'?btn('flipHinge','Inverser la charnière'):''}</div>`}

const getCap=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
let plans=null,plansErr='',plansUnsub=null,pendingDel=null;
async function saveCloud(asNew){
  const db=await getCap('db');if(!db){toast('Enregistrement en ligne indisponible ici. Utilisez Exporter → Fichier .json.');return}
  const data={name:state.name,textSize:state.textSize,items:state.items};
  if(JSON.stringify(data).length>240000){toast('Plan trop lourd pour l\'enregistrement en ligne. Exportez-le en .json.');return}
  const id=(!asNew&&state.cloudId)||Date.now().toString(36)+uid();
  $('#saveState').textContent='Enregistrement…';
  try{await db.doc('plandata/'+id).set({data});await db.doc('plans/'+id).set({name:state.name||'Sans titre',updatedAt:new Date().toISOString(),count:state.items.length});
    state.cloudId=id;unsaved=false;saveDraft();renderSaveState();toast('Plan enregistré : '+(state.name||'Sans titre'))}
  catch(e){renderSaveState();toast(e&&e.code==='quota_exceeded'?'Stockage plein : supprimez d\'anciens plans dans « Mes plans ».':e&&e.code==='invalid_argument'?'Cette page est en lecture seule pour vous : exportez le plan en .json.':'L\'enregistrement a échoué. Réessayez dans un instant.')}
}
async function openPlans(){
  renderPlans();
  const db=await getCap('db');
  if(!db){plansErr='L\'enregistrement en ligne n\'est pas disponible dans cette vue. Vous pouvez toujours importer ou exporter un fichier .json.';renderPlans();return}
  if(!plansUnsub)plansUnsub=db.collection('plans').orderBy('updatedAt','desc').limit(500).onSnapshot(s=>{plans=s.docs.map(d=>({id:d.id,...d.data()}));if(!$('#modal').hidden&&dlg.dataset.view==='plans')renderPlans()},e=>{plansErr='Liste indisponible ('+e.code+').';renderPlans()});
}

  showModal(`<h2>Mes plans</h2><div class="plist">${list}</div><div class="foot"><button class="btn" data-m="import">Importer un .json</button><button class="btn" data-m="saveas">Enregistrer une copie</button><button class="btn" data-m="no">Fermer</button></div>`);
  dlg.dataset.view='plans';

/* --- export : PDF/PNG/SVG à l'échelle sur une feuille, ou .json --- */
let exp=Object.assign({fmt:'pdf',paper:'A3',orient:'landscape',scale:'auto'},store.get('plancote.export')||{});

  let [pw,ph]=PAPERS[exp.paper];if(exp.orient==='portrait')[pw,ph]=[ph,pw];
  const b=boundsAll(),m=10,tb=14,aw=pw-2*m,ah=ph-2*m-tb;
  const fits=s=>!!b&&(b.x1-b.x0)/s<=aw&&(b.y1-b.y0)/s<=ah;
  const scale=exp.scale==='auto'?(SCALES.find(fits)||SCALES[SCALES.length-1]):+exp.scale;
  return {pw,ph,m,ah,b,scale,fits:fits(scale)};
}
/* Bâtiment pour le configurateur gondoles (mm) : fond de plan SVG + volumes 3D.
   Chaque côté de mur devient un ou plusieurs blocs, coupés aux ouvertures, avec allège et linteau. */
function openingZ(o,H){const h=+o.height;
  if(o.kind==='fenetre')return [900,Math.min(H,900+(h||1200))];
  if(['simple','double','coulissante'].includes(o.kind))return [0,Math.min(H,h||2100)];
  return [0,Math.min(H,h||H)]}
function buildingExport(items){
  const solids=[],zones=[],b=boundsAll(items);let maxH=0;
  for(const w of items){if(w.type!=='wall'||w.pts.length<2)continue;
    const H=+w.height||3000,g=wallGeom(w),n=w.pts.length,[ra,rb]=wallRange(w);maxH=Math.max(maxH,H);
    for(let i=0;i<segCount(w);i++){const p0=w.pts[i],v=sub(w.pts[(i+1)%n],p0),L=len(v);if(L<1)continue;
      const dir=mul(v,1/L),nn=perp(dir),at=(s,off)=>add(add(p0,mul(dir,s)),mul(nn,off)),mur=(pts,z0,z1)=>solids.push({kind:'mur',pts,z0,z1});
      const ops=items.filter(o=>o.type==='opening'&&o.host===w.id&&o.seg===i).map(o=>{const og=openingGeom(o),hw=Math.min(o.width,L)/2;return og&&{s0:og.t-hw,s1:og.t+hw,o}}).filter(Boolean).sort((a,c)=>a.s0-c.s0);
      let a=g.A[i],c=g.B[i];
      for(const {s0,s1,o} of ops){mur([a,at(s0,ra),at(s0,rb),c],0,H);
        const gap=[at(s0,ra),at(s1,ra),at(s1,rb),at(s0,rb)],[zb,zt]=openingZ(o,H);
        if(zb>0)mur(gap,0,zb);if(zt<H)mur(gap,zt,H);a=at(s1,ra);c=at(s1,rb)}
      mur([a,g.A[(i+1)%n],g.B[(i+1)%n],c],0,H)}}
  for(const it of items){
    if(it.type==='rect'&&it.cross)solids.push({kind:'poteau',pts:rectCorners(it),z0:0,z1:maxH||3000,color:it.color});
    else if(it.type==='rect'&&it.fill&&it.fill!=='none')zones.push({pts:rectCorners(it),color:it.fill});
    else if(it.type==='line'&&it.closed&&it.fill&&it.fill!=='none'&&it.pts.length>2)zones.push({pts:it.pts,color:it.fill})}
  const rd=p=>[Math.round(p[0]),Math.round(p[1])];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${r(b.x0)} ${r(b.y0)} ${r(b.x1-b.x0)} ${r(b.y1-b.y0)}" width="${Math.round((b.x1-b.x0)/10)}" height="${Math.round((b.y1-b.y0)/10)}">${drawItems(items,{u:20,font:'Arial, Helvetica, sans-serif'})}</svg>`;
  return {app:'PlanCoté',kind:'batiment',version:1,name:state.name,unit:'mm',bounds:b,svg,
    solids:solids.map(s=>({...s,pts:s.pts.map(rd)})),zones:zones.map(z=>({...z,pts:z.pts.map(rd)}))};
}
function sheetSVG(L){
  const {pw,ph,m,ah,b,scale:S}=L,U=S*.2646,F='Helvetica, Arial, sans-serif',mm=v=>r(v*S),ink='#1b2330',muted='#5a6676';
  const vx=(b.x0+b.x1)/2-pw*S/2,vy=(b.y0+b.y1)/2-(m+ah/2)*S,X=v=>vx+v*S,Y=v=>vy+v*S;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${pw}mm" height="${ph}mm" viewBox="${r(vx)} ${r(vy)} ${mm(pw)} ${mm(ph)}"><rect x="${r(vx)}" y="${r(vy)}" width="${mm(pw)}" height="${mm(ph)}" fill="#ffffff"/>`;
  s+=drawItems(state.items,{u:U,font:F});
  const tw=150,th=12,tx=pw-5-tw,ty=ph-5-th,lw=mm(.3);
  s+=`<rect x="${r(X(5))}" y="${r(Y(5))}" width="${mm(pw-10)}" height="${mm(ph-10)}" fill="none" stroke="${ink}" stroke-width="${lw}"/>`;
  s+=`<rect x="${r(X(tx))}" y="${r(Y(ty))}" width="${mm(tw)}" height="${mm(th)}" fill="#ffffff" stroke="${ink}" stroke-width="${lw}"/><path d="M${r(X(tx+78))} ${r(Y(ty))}v${mm(th)}M${r(X(tx+106))} ${r(Y(ty))}v${mm(th)}" stroke="${ink}" stroke-width="${lw}"/>`;
  const name=(state.name||'Sans titre').length>40?(state.name.slice(0,39)+'…'):(state.name||'Sans titre');
  s+=txt([X(tx+3),Y(ty+4)],name,S*3,ink,F,{anchor:'start',bold:true});
  s+=txt([X(tx+3),Y(ty+8.8)],'RSL · Rayonnages Services Lorraine',S*2.1,muted,F,{anchor:'start'});
  s+=txt([X(tx+81),Y(ty+3.6)],'ÉCHELLE',S*1.8,muted,F,{anchor:'start'})+txt([X(tx+81),Y(ty+8.6)],'1:'+S,S*3.2,ink,F,{anchor:'start',bold:true});
  s+=txt([X(tx+109),Y(ty+3.6)],'DATE · UNITÉS',S*1.8,muted,F,{anchor:'start'})+txt([X(tx+109),Y(ty+8.6)],new Date().toLocaleDateString('fr-FR')+' · mm',S*2.6,ink,F,{anchor:'start'});
  return s+'</svg>';
}
function openExport(){renderExport();dlg.dataset.view='export'}
function renderExport(){
  const L=state.items.length?sheetLayout():null,radio=(k,v,l)=>`<label><input type="radio" name="${k}" value="${v}"${String(exp[k])===String(v)?' checked':''}> ${l}</label>`;
  const sheet=!['json','bat'].includes(exp.fmt);
  let info='';
  if(!L)info='<div class="info warn">Le plan est vide.</div>';
  else if(sheet){const bw=(L.b.x1-L.b.x0)/1000,bh=(L.b.y1-L.b.y0)/1000;
    info=L.fits?`<div class="info">Le plan (${bw.toFixed(2).replace('.',',')} × ${bh.toFixed(2).replace('.',',')} m) tient sur ${exp.paper} ${exp.orient==='landscape'?'paysage':'portrait'} à l'échelle <b>1:${L.scale}</b>. Imprimé à 100 %, 1 mm sur le papier = ${L.scale} mm réels.</div>`
      :`<div class="info warn">À 1:${L.scale}, le plan déborde de la feuille ${exp.paper}. Choisissez une échelle plus petite (ex. 1:${(SCALES.find(s=>s>L.scale)||L.scale)}), une feuille plus grande, ou « Auto ».</div>`}
  showModal(`<h2>Exporter le plan</h2>
    <div class="fld"><span>Format</span><div class="seg" data-g="fmt">${radio('fmt','pdf','PDF à l\'échelle')}${radio('fmt','png','Image PNG')}${radio('fmt','svg','SVG')}${radio('fmt','json','Fichier .json (réouvrable)')}${radio('fmt','bat','Bâtiment pour le plan gondoles')}</div></div>
    ${exp.fmt==='bat'?'<div class="info">Fichier .json à ouvrir dans le configurateur gondoles avec le bouton « Bâtiment ». Murs, portes, fenêtres, poteaux et zones y apparaissent en 2D et en 3D, à la hauteur réglée sur chaque mur.</div>':''}
    ${sheet?`<div class="fld"><span>Feuille</span><div class="seg">${Object.keys(PAPERS).map(p=>radio('paper',p,p)).join('')}</div></div>
    <div class="fld"><span>Orientation</span><div class="seg">${radio('orient','landscape','Paysage')}${radio('orient','portrait','Portrait')}</div></div>
    <label class="fld" for="expScale"><span>Échelle</span><select id="expScale"><option value="auto"${exp.scale==='auto'?' selected':''}>Auto (la plus grande qui tient)</option>${SCALES.map(s=>`<option value="${s}"${String(exp.scale)===String(s)?' selected':''}>1:${s}</option>`).join('')}</select></label>`:''}
    ${info}
    <div class="foot"><button class="btn" data-m="no">Fermer</button><button class="btn primary" data-m="doexport"${L?'':' disabled'}>Exporter</button></div>`);
  dlg.dataset.view='export';
}
dlg.addEventListener('change',e=>{if(dlg.dataset.view!=='export')return;const t=e.target;if(t.name)exp[t.name]=t.value;if(t.id==='expScale')exp.scale=t.value;store.set('plancote.export',exp);renderExport()});
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s)})}
async function saveFile(filename,data){
  const dl=await getCap('downloads');if(!dl){toast('Le téléchargement n\'est pas disponible dans cette vue.');return}
  try{await dl.save({filename,data})}catch(e){if(e&&e.code!=='declined')toast(e&&e.code==='rate_limited'?'Un téléchargement est déjà en attente.':'Téléchargement impossible ('+(e&&e.code||'erreur')+').')}
}
async function doExport(){
  const base=(state.name||'plan').replace(/[\\/:*?"<>|]+/g,'-').trim()||'plan';
  if(exp.fmt==='bat'){closeModal();return saveFile(base+' - batiment.json',JSON.stringify(buildingExport(state.items)))}
  if(exp.fmt==='json'){closeModal();return saveFile(base+'.json',JSON.stringify({app:'PlanCoté',version:1,name:state.name,textSize:state.textSize,items:state.items},null,1))}
  const L=sheetLayout(),svgStr=sheetSVG(L),fn=`${base} 1-${L.scale}`;
  const b=dlg.querySelector('[data-m="doexport"]');b.disabled=true;b.textContent='Préparation…';
  try{
    if(exp.fmt==='svg'){closeModal();return saveFile(fn+'.svg',svgStr)}
    if(exp.fmt==='png'){const blob=await svgToPng(svgStr,L.pw,L.ph,150);closeModal();return saveFile(fn+'.png',blob)}
    if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@3.0.1/dist/jspdf.umd.min.js');
    if(!window.svg2pdf)await loadScript('https://cdn.jsdelivr.net/npm/svg2pdf.js@2.5.0/dist/svg2pdf.umd.min.js');
    const pdf=new window.jspdf.jsPDF({orientation:L.pw>L.ph?'landscape':'portrait',unit:'mm',format:[L.pw,L.ph]});
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0;width:10px;height:10px;overflow:hidden';host.innerHTML=svgStr.replace(/²/g,'2');document.body.appendChild(host); // shortcut: les polices PDF standard perdent le « ² », écrit « m2 » dans le PDF
    try{await window.svg2pdf.svg2pdf(host.firstElementChild,pdf,{x:0,y:0,width:L.pw,height:L.ph})}finally{host.remove()}
    closeModal();await saveFile(fn+'.pdf',pdf.output('blob'));
  }catch(e){console.error(e);toast('L\'export a échoué. Essayez le format SVG ou PNG.');if(b){b.disabled=false;b.textContent='Exporter'}}
}
async function svgToPng(svgStr,pw,ph,dpi){
  const w=Math.round(pw/25.4*dpi),h=Math.round(ph/25.4*dpi),url=URL.createObjectURL(new Blob([svgStr.replace(/width="[^"]+mm" height="[^"]+mm"/,`width="${w}" height="${h}"`)],{type:'image/svg+xml'}));
  try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    return await new Promise(res=>c.toBlob(res,'image/png'))}finally{URL.revokeObjectURL(url)}
}
